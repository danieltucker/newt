# ─────────────────────────────────────────────────────────────────────────────
# Build the server + client images on GitHub's native amd64 runners and push
# them to GHCR, where TrueNAS pulls them from.
#
# Why here and not on the dev machine: the dev box is Windows/arm64 with no
# Docker installed, and TrueNAS is amd64 — a local build would need QEMU
# emulation. Runners are amd64 already, and GITHUB_TOKEN authenticates to GHCR
# with no personal access token to create or rotate.
# ─────────────────────────────────────────────────────────────────────────────
name: Publish images

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish (e.g. v1.9.3)'
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: server/Dockerfile
          - name: client
            dockerfile: client/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR owner must be lowercase; a capitalised GitHub username would
      # otherwise produce an invalid image reference.
      - name: Resolve image name
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/newtab-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Root context — both Dockerfiles need the root package-lock.json.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: |
          echo "### newtab-${{ matrix.name }} published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
