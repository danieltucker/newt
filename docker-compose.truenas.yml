# ─────────────────────────────────────────────────────────────────────────────
# Production deployment for TrueNAS SCALE (Docker / Compose runtime).
#
# Images are PULLED from GHCR — build & push them from your dev machine first:
#     ./scripts/deploy/build-and-push.sh
#
# Supply values with a .env file next to this file (see .env.truenas.example),
# or fill them into the TrueNAS Custom App "environment" fields.
#
# Access model: HTTPS terminated by your reverse proxy, which forwards to
# http://<truenas-ip>:${APP_PORT}. The client's nginx serves the SPA and proxies
# /api/ to the server container, so the reverse proxy only needs this one upstream.
# ─────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: newtab
      POSTGRES_USER: newtab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      # Bind-mount to a real TrueNAS dataset so the DB is covered by snapshots/backups
      # (create the dataset first, e.g. /mnt/Core Storage/Containers/newt/pgdata).
      #
      # Long syntax rather than the usual "source:target" shorthand because this
      # pool's name contains a space. The shorthand is split on ":" and quoting a
      # path with spaces through .env -> compose -> Docker is fragile; naming the
      # fields explicitly removes the ambiguity entirely.
      - type: bind
        source: ${PGDATA_HOST_PATH:?Set PGDATA_HOST_PATH to a TrueNAS dataset path}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtab -d newtab"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    image: ghcr.io/${GHCR_OWNER:-danieltucker}/newtab-server:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://newtab:${POSTGRES_PASSWORD}@postgres:5432/newtab
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      # Encrypts the LLM API keys users connect in Settings → AI.
      LLM_KEY_SECRET: ${LLM_KEY_SECRET:?Set LLM_KEY_SECRET}
      # Exact public URL users visit (scheme + host, no trailing slash). Must match for CORS.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN to your https URL}
      # Serving over HTTPS -> keep true so auth cookies get the Secure flag.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Proxy hops in front of the server: your reverse proxy + the client nginx = 2.
      # Adjust if your edge differs (e.g. Cloudflare Tunnel changes the count).
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # Close signups after you create your account(s).
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # Console ping/tracert endpoints — keep false on an internet-facing deployment.
      CONSOLE_ENABLED: ${CONSOLE_ENABLED:-false}
      # Model-training and AI-answer crawlers (GPTBot, ClaudeBot, CCBot, …).
      # 'deny' is the default and what robots.txt will say; set to 'allow' to let
      # them in. Denying is reversible and allowing is not, which is the only
      # reason it is the default rather than a position on the question.
      AI_CRAWLERS: ${AI_CRAWLERS:-deny}
      # Where the server fetches the built index.html to wrap its server-rendered
      # pages in — the client container, over the internal network. Only change it
      # if the client service is renamed.
      SHELL_ORIGIN: ${SHELL_ORIGIN:-http://client}
      # ── AI tasks: which private hosts the site model may reach ───────────────
      # THE ONE SETTING THAT MUST LIVE HERE RATHER THAN IN THE ADMIN PANEL.
      #
      # Endpoints themselves are configured in Admin → AI → Models, which
      # is a convenience: switching model or adding a box shouldn't need a shell.
      # But the site model is the only call in Newt permitted to reach an address
      # inside your network, and *that* capability stays gated on host access —
      # editing a database row needs only an admin web session, which is a much
      # cheaper thing for an attacker to obtain than this file.
      #
      # So: the panel may name any endpoint. A public one just works. A private
      # one works only if its host is listed here. Comma-separated; entries may
      # be a hostname (a compose service, whose container IP changes on recreate)
      # or a literal address (a box on the LAN).
      #
      #   OPERATOR_LLM_PRIVATE_HOSTS=ollama,192.168.1.50
      #
      # Leave blank and the panel accepts only public HTTPS endpoints.
      OPERATOR_LLM_PRIVATE_HOSTS: ${OPERATOR_LLM_PRIVATE_HOSTS:-}
      # ── Legacy single-endpoint config (still honoured) ───────────────────────
      # How the operator model was configured before the admin panel existed. Used as a
      # fallback when no endpoint has been added there, so an upgrade doesn't
      # switch the AI tasks off. Its host is allowlisted automatically. Prefer the
      # panel for anything new.
      OPERATOR_LLM_BASE_URL: ${OPERATOR_LLM_BASE_URL:-}
      OPERATOR_LLM_MODEL: ${OPERATOR_LLM_MODEL:-}
      OPERATOR_LLM_KEY: ${OPERATOR_LLM_KEY:-}
      PORT: 3001
      NODE_ENV: production
    # No host port — the server is reached only via the client's nginx (/api proxy).
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: ghcr.io/${GHCR_OWNER:-danieltucker}/newtab-client:${IMAGE_TAG:-latest}
    ports:
      # host:container — point your HTTPS reverse proxy at http://<truenas-ip>:${APP_PORT}.
      # Do NOT use 80/443: those belong to the TrueNAS web UI.
      - "${APP_PORT:-30080}:80"
    depends_on:
      - server
    restart: unless-stopped

  # ── Optional: the instance's own model, for AI tasks ────────────────────────
  #
  # Commented out by default because it is a real resource commitment, not a
  # flag: model weights are gigabytes, and CPU-only inference on a NAS is slow
  # enough that you want to measure it before relying on it. Moderation writes
  # short comments, which is the workload this suits best.
  #
  # WHY IT IS A SEPARATE SERVICE AND NOT PART OF THE SERVER IMAGE:
  #   - The server image is a few hundred MB of Node. Ollama's is ~1.5GB before
  #     any model. Baking it in would turn every app deploy — which is a pull and
  #     recreate — into a multi-gigabyte download.
  #   - Weights belong on a dataset with its own snapshot policy, exactly like
  #     PGDATA_HOST_PATH. That is a storage decision, not an app decision.
  #   - Pulling a model or upgrading Ollama would take Newt down with it.
  #
  # NOTE THERE IS NO `ports:` SECTION, AND THAT IS THE POINT. Ollama is reachable
  # only from the server over the compose network, at http://ollama:11434. It is
  # never published to the host or the internet, and it has no authentication of
  # its own — publishing it would hand anyone who found it free use of your GPU.
  #
  # To use it:
  #   1. Uncomment this service.
  #   2. Set in .env:  OPERATOR_LLM_PRIVATE_HOSTS=ollama
  #      (Without this the admin panel refuses the address — by design.)
  #   3. sudo docker compose -f docker-compose.truenas.yml up -d
  #   4. In Admin → AI → Models, add:
  #        Base URL  http://ollama:11434/v1
  #        Model     qwen3:30b-a3b      ("List models" reads them off the box)
  #   5. Download a model from Admin → AI → Models → Downloaded models. Newt
  #      drives Ollama's /api/pull itself now, so this is the fallback:
  #        sudo docker compose -f docker-compose.truenas.yml exec ollama \
  #          ollama pull qwen3:30b-a3b
  #      (Until a model exists, generation fails with a model-not-found error.)
  #
  #      A pull writes several GB to the volume below and **Newt cannot see how
  #      much space is left on it** — this process has no filesystem access to
  #      the Ollama container's host. That check has to be yours; a pull onto a
  #      full dataset takes Postgres down with it.
  #
  # Sizing, for a 24GB card: an 8B at q4 is ~5GB and fast; a 24-32B at q4 is
  # ~15-20GB and writes noticeably better prose; a 70B at q4 is ~40GB and will
  # NOT fit. Only one model is resident at a time, so configuring several and
  # alternating between them costs an unload and reload each way — the Usage
  # panel's median-vs-p95 gap is what exposes that.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   volumes:
  #     # Model weights. Point this at a real dataset — re-pulling 5GB because a
  #     # container was recreated is the failure this avoids.
  #     - type: bind
  #       source: ${OLLAMA_HOST_PATH:?Set OLLAMA_HOST_PATH to a TrueNAS dataset path}
  #       target: /root/.ollama
  #   restart: unless-stopped
  #   # An NVIDIA GPU makes this perhaps 20x faster. Requires the container
  #   # toolkit on the host; leave commented for CPU-only inference.
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: all
  #   #           capabilities: [gpu]
