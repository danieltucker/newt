server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxy API requests to the server container
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback - all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers for the HTML document and its assets.
        #
        # These live here rather than at server level on purpose: the API already
        # sets its own headers via helmet, and nginx add_header at server level
        # would be inherited into /api/ too, so every proxied response would carry
        # two Content-Security-Policy headers. Browsers enforce the intersection of
        # duplicated policies, which makes the effective policy hard to reason
        # about. The document is the thing that needs a policy; leave the API's to
        # helmet.
        #
        # `always` so they are still sent on error responses (404, 5xx), which are
        # HTML too and just as framable.

        # Clickjacking. frame-ancestors is the modern control and the one that
        # actually covers nested frames; X-Frame-Options is kept for older agents.
        # Neither restricts *us* embedding other sites — that is frame-src below,
        # which the article reader needs.
        add_header X-Frame-Options "DENY" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Nothing in the app uses these, so hand them to no one — including any
        # third-party page loaded in the reader iframe.
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

        # The backstop the sanitizer never had. Worth knowing before editing:
        #
        #  script-src  'self' plus a hash for the one inline script in index.html
        #              (the pre-paint theme switch). It is hashed rather than
        #              allowed via 'unsafe-inline' because 'unsafe-inline' would
        #              re-admit exactly the injected-script attack this exists to
        #              stop. NOTE: editing that script changes its hash and it will
        #              silently stop running — see the comment in client/index.html.
        #  style-src   needs 'unsafe-inline': React writes style="" attributes and
        #              no hash can cover those. CSS injection is a far smaller
        #              problem than script injection, so this is the usual trade.
        #  img-src     https: and data: — favicons, feed article images and
        #              base64 avatars all come from arbitrary origins.
        #  frame-src   https: — the article reader embeds the site being read.
        #  connect-src 'self': the API is same-origin through this proxy. If the
        #              client ever calls a third-party API directly, add it here.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-qrYA0vKe8GA6N94IrmwGBauOxI69rqva0pswMmE0mDc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src https:; media-src 'self' https:; manifest-src 'self'" always;
    }
}
