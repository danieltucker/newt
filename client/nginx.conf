# The cache backing the server-rendered document routes below.
#
# Declared here rather than inside the server block on purpose: proxy_cache_path
# is only valid at http level, and this file is included from inside http{} (as
# conf.d/default.conf), so the top of it is the one place in this file that is
# at the right level. Moving it inside `server` is a startup error.
#
# keys_zone is 10MB of metadata, good for tens of thousands of entries; the
# bodies are capped at 200MB on disk and evicted a day after last use. Both are
# far more than the page count needs and cost nothing when unused.
proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr_cache:10m
                 max_size=200m inactive=1d use_temp_path=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxy API requests to the server container
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;

        # Image uploads are raw binary bodies of up to MAX_IMAGE_BYTES (4 MB).
        # nginx defaults to 1m, which would 413 anything larger before it ever
        # reached Express — a production-only failure, since dev goes through the
        # Vite proxy with no nginx in the path. Set slightly above the app's own
        # limit so the server stays the thing that enforces it and can return a
        # readable JSON error instead of nginx's bare HTML 413.
        # NOTE: any reverse proxy in front of this (Nginx Proxy Manager, etc.)
        # has the same 1m default and needs the same treatment.
        client_max_body_size 5m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Server-rendered public documents ─────────────────────────────────────
    #
    # These paths are served by Express rather than from disk, because they are
    # the ones a person shares and a crawler fetches, and they need a <head>
    # that describes the specific page. Everything else still falls through to
    # the SPA below — the app is unchanged, this only gives these URLs a
    # document that says what they are.
    #
    # The regex is anchored and lists the prefixes explicitly rather than
    # proxying anything that "looks like" a page: an over-broad rule here would
    # quietly route the app's own asset requests through Node.
    #
    # Cached, because every one of these responses is public and identical for
    # every caller. A crawler working through the sitemap is the traffic this is
    # built for, and it should cost one render per page per five minutes, not
    # one per request.
    location ~ ^/(u|a|t)/|^/(recent|robots\.txt|sitemap[a-z0-9-]*\.xml)$ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        proxy_cache ssr_cache;
        # Keyed on the path *and query*, so ?page=2 is not served the first page.
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5m;
        # 404s are cached too, briefly. An un-published post being re-fetched by
        # a crawler should not reach the database every time — but a minute, so
        # that re-publishing shows up quickly rather than at the next deploy.
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;

        # A document rendered by Express still needs the document policy; see the
        # header at the top of this file for why it cannot be inherited.
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback - all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;

        # The same document policy the server-rendered routes above use. See
        # client/security-headers.conf for what each directive is for and why
        # it is an include rather than written inline in both places.
        include /etc/nginx/security-headers.conf;
    }
}
