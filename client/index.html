<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint into the notch/home-indicator
         strips, which is what stops iOS from filling them with a black band of
         its own. Everything pinned to an edge pays that back with
         env(safe-area-inset-*) padding - see .bar in ShellBar.module.css and
         the safe-area rules in styles/tokens.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Newt - a new tab worth opening</title>
    <!--SSR-HEAD-->
    <!-- The two SSR markers are where server/src/lib/htmlShell.ts injects a
         page's own head content and a crawlable copy of its body, for the
         public routes nginx proxies to Express (/u/, /a/, /t/ - see
         nginx.conf). Without them every URL the app serves carries the title
         above, which is why a shared link used to unfurl as a blank card
         everywhere.

         The title above is kept for the dev server and for every route that
         isn't injected; renderShell strips it whenever it writes a real one, so
         a document never ends up with two.

         Neither marker is load-bearing in the way the CSP-hashed script below
         is: renderShell falls back to injecting before the closing head and
         body tags if they're missing. Moving them is fine. Renaming them is
         not - the strings are matched literally.

         ── Do not name the closing head or body tag anywhere in this file ──
         Not in markup, and not in prose inside a comment like this one. Vite
         injects the entry script and stylesheet immediately before the FIRST
         regex match for the closing head tag in the source; it does not parse
         the HTML first, so it cannot tell that a match is inside a comment.

         This is not hypothetical. The paragraph above used to spell both tags
         out, and v1.15.0 shipped with the app's own script and stylesheet
         injected into the middle of this comment - so every route served a
         document with an empty #root, no stylesheet and no application, while
         the build stayed green and every test passed. scripts/check-html.mjs
         is the guard that now fails the build instead. -->
    <!-- ── The card every un-injected route unfurls as ──
         Between these two markers is what a link to /, /blog, /explore or any
         other route nginx serves straight off disk says about itself when it is
         pasted into iMessage, Slack or a post. Without it those links carried a
         title and nothing else, so the preview was the app's tagline and the
         raw URL - which is what a link looks like when nobody has written a
         card for it.

         server/src/lib/htmlShell.ts removes this whole region whenever it
         injects a real head, exactly as it removes the static title above and
         for the same reason: two og:title tags in a document is not an error,
         it is an unfurler picking one of them, and that is precisely the bug it
         would cause. Renaming the markers breaks that - they are matched
         literally.

         og:image is site-relative because a file on disk cannot know which
         origin it will be served from. Every unfurler that matters resolves it
         against the document's own URL; the server-rendered routes, which do
         know the origin, write absolute URLs instead. -->
    <!--SSR-FALLBACK-META-->
    <meta name="description" content="Newt is a new tab page that opens onto what you actually want to read: your feeds, your bookmarks, your notes and the people you follow.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Newt">
    <meta property="og:title" content="Newt - a new tab worth opening">
    <meta property="og:description" content="A new tab page that opens onto what you actually want to read: your feeds, your bookmarks, your notes and the people you follow.">
    <meta property="og:image" content="/shots/hero.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Newt - a new tab worth opening">
    <meta name="twitter:description" content="A new tab page that opens onto what you actually want to read: your feeds, your bookmarks, your notes and the people you follow.">
    <meta name="twitter:image" content="/shots/hero.png">
    <!--/SSR-FALLBACK-META-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/app-icons/apple-touch-icon-180.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- The colour mobile browsers paint their own chrome with - the iOS status
         bar strip, Android's toolbar. Left unset it comes out black, which is
         the black bar above the app on a phone, and stays black even in light
         theme. These two cover the frame before React mounts; App.tsx then
         overwrites both with the theme the user actually chose, which the media
         queries can't know about (theme is a setting, not just an OS
         preference). Keep the values in step with --bg in styles/tokens.css. -->
    <meta name="theme-color" content="#F2F3F9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#08090F" media="(prefers-color-scheme: dark)">
    <!-- Installed to the home screen, the status bar follows theme-color above
         rather than being a black slab. `default` (not black-translucent) so
         iOS keeps reserving the strip and the safe-area insets stay honest. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- Apply theme before first paint - prevents flash on both dark↔light toggle and page load -->
    <!--
      CSP-HASHED - do not edit without reading this.
      The Content-Security-Policy in client/nginx.conf allows the script below by
      the sha256 of its exact contents. Changing so much as a space here makes the
      browser refuse to run it, silently: the app still loads and the only symptom
      is a flash of the wrong theme on first paint.
      After editing, run `npm run csp:hash` and paste the new value into nginx.conf.
    -->
    <script>
      (function () {
        var t = localStorage.getItem('theme') || 'dark';
        if (t === 'auto') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!-- Instant background so the body isn't white before the CSS bundle loads.
         These are --bg from styles/tokens.css: they used to be a near-miss
         (#0e0e11 / #f5f5f7), which showed as a flicker to a slightly different
         shade on load and, now that the page paints into the safe areas, would
         also tint the notch strip a shade off from the app. -->
    <style>
      html[data-theme="dark"]  { background: #08090F; }
      html[data-theme="light"] { background: #F2F3F9; }
      body { margin: 0; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!--SSR-BODY-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
