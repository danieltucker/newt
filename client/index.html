<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newt - a new tab worth opening</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/app-icons/apple-touch-icon-180.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- Apply theme before first paint - prevents flash on both dark↔light toggle and page load -->
    <!--
      CSP-HASHED - do not edit without reading this.
      The Content-Security-Policy in client/nginx.conf allows the script below by
      the sha256 of its exact contents. Changing so much as a space here makes the
      browser refuse to run it, silently: the app still loads and the only symptom
      is a flash of the wrong theme on first paint.
      After editing, run `npm run csp:hash` and paste the new value into nginx.conf.
    -->
    <script>
      (function () {
        var t = localStorage.getItem('theme') || 'dark';
        if (t === 'auto') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!-- Instant background so the body isn't white before the CSS bundle loads -->
    <style>
      html[data-theme="dark"]  { background: #0e0e11; }
      html[data-theme="light"] { background: #f5f5f7; }
      body { margin: 0; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
