# Security headers for HTML documents and their assets.
#
# Pulled out of nginx.conf into an include because there are now two locations
# that serve documents: the SPA fallback, and the block that proxies the public
# routes (/u/, /a/, /t/, sitemap.xml, robots.txt) to Express for a
# server-rendered <head>. nginx's add_header is inherited by a child block only
# if that block declares *no* add_header of its own, so the SSR location would
# silently have come out with helmet's headers and none of these — a document
# with no CSP and no frame-ancestors, served on exactly the URLs most likely to
# be shared and embedded.
#
# Not applied at server level, and not to /api/: helmet already sets the API's
# headers, and a duplicated Content-Security-Policy is enforced as the
# intersection of the two, which makes the effective policy very hard to reason
# about.
#
# `always` so they are still sent on error responses (404, 5xx) — the SSR routes
# answer 404 with a real document for un-published posts, and that document is
# just as framable as any other.

# Clickjacking. frame-ancestors is the modern control and the one that actually
# covers nested frames; X-Frame-Options is kept for older agents. Neither
# restricts *us* embedding other sites — that is frame-src below, which the
# article reader needs.
add_header X-Frame-Options "DENY" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing in the app uses these, so hand them to no one — including any
# third-party page loaded in the reader iframe.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

# The backstop the sanitizer never had. Worth knowing before editing:
#
#  script-src  'self' plus a hash for the one inline script in index.html
#              (the pre-paint theme switch). It is hashed rather than allowed via
#              'unsafe-inline' because 'unsafe-inline' would re-admit exactly the
#              injected-script attack this exists to stop. NOTE: editing that
#              script changes its hash and it will silently stop running — see
#              the comment in client/index.html.
#
#              The server-rendered pages also emit a
#              <script type="application/ld+json"> block. That is a data block,
#              not executable script — an HTML parser never runs it — so it needs
#              no hash and none is given. What it *does* need is escaping, since
#              the parser still scans it for </script; see lib/htmlEscape.ts.
#  style-src   needs 'unsafe-inline': React writes style="" attributes and no
#              hash can cover those. CSS injection is a far smaller problem than
#              script injection, so this is the usual trade.
#  img-src     https: and data: — favicons, feed article images and base64
#              avatars all come from arbitrary origins.
#  frame-src   https: — the article reader embeds the site being read.
#  connect-src 'self' plus cloudflareinsights.com — the API is same-origin
#              through this proxy; the second is where the analytics beacon
#              below reports to. If the client ever calls another third-party
#              API directly, add it here.
#
# ── Cloudflare ──
# The edge injects scripts into every HTML response, and this policy governs
# them because they run in our document. Two kinds, and only one needs naming:
#
#   Same-origin, already covered by 'self'. Anything served from /cdn-cgi/ —
#   email-decode.min.js from Scrape Shield, rocket-loader.min.js — is our own
#   origin as far as the browser is concerned. Turning those features on needs
#   no change here.
#
#   Third-party, named explicitly. static.cloudflareinsights.com serves the Web
#   Analytics beacon, which was silently blocked from the day this file was
#   added until it was allowed here. The matching connect-src entry is where the
#   beacon POSTs its measurements; without it the script loads and then fails at
#   the last step, which is a worse failure than not loading at all because
#   nothing in the console says so.
#
# Deliberately NOT added: 'unsafe-inline'. Rocket Loader works by rewriting
# every script's type attribute and re-executing it later, and Cloudflare
# documents it as incompatible with hash-based CSP for that reason. The fix for
# Rocket Loader is to leave it off — it does nothing for a single bundled module
# script anyway — not to open the door this policy exists to close.
#
# Adding another service later: name the exact origin, add it to the directive
# that governs how it loads (script-src for a tag, connect-src for a fetch,
# frame-src for an embed), and say here what it is. No wildcards.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-qrYA0vKe8GA6N94IrmwGBauOxI69rqva0pswMmE0mDc=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://cloudflareinsights.com; frame-src https:; media-src 'self' https:; manifest-src 'self'" always;
